name: Delete old IPA artifacts

# Owner's request (2026-10-01): the unsigned IPA artifacts of old builds are
# not needed. Since 2026-10-02 build-ipa.yml uploads no IPA artifact at all;
# run this with a high number (e.g. 100000) to remove every one that is left. Deletes every `madeira-0.1.<N>-unsigned-ipa` artifact whose build
# number N is below the input, and every `madeira-unsigned-ipa` (the older,
# unnumbered name); other artifacts (build logs) are kept. Prints
# only artifact names.
on:
  workflow_dispatch:
    inputs:
      below:
        description: "Delete IPA artifacts of builds below this number"
        required: true
        default: "260"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete IPA artifacts below the given build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BELOW: ${{ inputs.below }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request
          token, repo, below = os.environ["GH_TOKEN"], os.environ["REPO"], int(os.environ["BELOW"])
          def call(method, path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", method=method,
                                           headers={"Authorization": f"Bearer {token}",
                                                    "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          victims, page = [], 1
          while True:
              d = call("GET", f"/actions/artifacts?per_page=100&page={page}")
              for a in d["artifacts"]:
                  m = re.fullmatch(r"madeira-0\.1\.(\d+)-unsigned-ipa", a["name"])
                  # builds before the numbered names (up to ~164) used one fixed name
                  if (m and int(m.group(1)) < below) or a["name"] == "madeira-unsigned-ipa":
                      victims.append(a)
              if len(d["artifacts"]) < 100:
                  break
              page += 1
          freed = 0
          for a in victims:
              call("DELETE", f"/actions/artifacts/{a['id']}")
              freed += a["size_in_bytes"]
              print("deleted", a["name"])
          print(f"::notice::deleted {len(victims)} IPA artifacts below build {below} ({freed / 1e9:.2f} GB)")
          EOF
